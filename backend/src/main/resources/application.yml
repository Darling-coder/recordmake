server:
  port: 8080  # 后端运行端口

spring:
  # 数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/record_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root    # 改成你的mysql账号
    password: 815815  # 改成你的mysql密码

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  web:
    resources:
      static‑locations: file:${upload.path},classpath:/static/



  sql:
    init:
      dependency-detection: false
  # 文件上传（唱片封面图片）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.itheima.recorddid.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
# 自定义本地存储路径（改成你电脑本地文件夹）
upload:
  # 磁盘真实存放路径，末尾一定要 /
  path: D:/idea code/record‑did/upload/
  # 返回给前端、存数据库的前缀
  prefix: /upload/




